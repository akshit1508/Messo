# ===================================================================
# MESO Demo & Development Profile
# Activate via --spring.profiles.active=demo
# ===================================================================

spring.application.name=messo-demo

spring.datasource.url=jdbc:mysql://localhost:3306/messo
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Demo environment safety flags
app.demo.seed.enabled=true
app.ai.service.url=http://localhost:8000
app.ai.service.timeout-ms=5000

# CORS configuration for development frontend
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002
