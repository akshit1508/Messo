spring.application.name=messo

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/messo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false
spring.jpa.open-in-view=false

server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# CORS configuration for Next.js
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}

# AI Microservice URL (FastAPI)
app.ai-service.url=${APP_AI_SERVICE_URL:http://127.0.0.1:8000}
